name: tests

on:
    push:
        branches:
            - main
            - dev
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: testing
                    MYSQL_DATABASE: core_test
                ports:
                    - 3307:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3307
            DB_DATABASE: core_test
            DB_USERNAME: root
            DB_PASSWORD: testing

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.5'
                  extensions: pdo_sqlite, pdo_mysql, pcntl
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.3.11'

            - name: Setup Application
              run: |
                  composer install --no-interaction --prefer-dist
                  cp .env.example .env
                  php artisan key:generate --no-interaction
                  php artisan migrate --force --no-interaction
                  bun install --frozen-lockfile
                  bun run build

            - name: Run CI Checks
              run: bun run ci:check
